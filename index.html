<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOMNIX | Em Manutenção</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&display=swap');

        :root {
            --dark-indigo: #0D1B2A;
            --glow-cyan: #00FFFF; /* Cor do botão original: Descubra a Simbiose */
            --text-light: #F0F2F5;
            --text-white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sora', sans-serif;
            background-color: var(--dark-indigo);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100vh;
            overflow: hidden; /* Garante que a imagem de fundo não cause barra de rolagem */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Novo Estilo para a Imagem de Fundo Temática */
        .maintenance-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('placeholder-carbon-credit-sustainability-nature.jpg'); /* Placeholder para Imagem Representativa */
            background-size: cover;
            background-position: center;
            opacity: 0.15; /* Sutilmente visível */
            z-index: -1;
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            padding: 0 10%;
        }

        /* Estilo para Centralizar o Logo */
        .logo-center {
            font-size: 3rem;
            font-weight: 800;
            color: var(--text-white);
            text-decoration: none;
            letter-spacing: 2px;
            margin-bottom: 40px;
            display: inline-block;
            text-align: center;
        }

        .logo-center span {
            color: var(--glow-cyan);
            text-shadow: 0 0 15px var(--glow-cyan);
        }

        /* Estilos do Conteúdo Principal */
        .hero-title {
            font-size: 4.5rem;
            font-weight: 800;
            color: var(--text-white);
            line-height: 1.05;
            margin-bottom: 30px;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
            max-width: 900px;
            letter-spacing: -1px;
        }

        .hero-description {
            font-size: 1.4rem;
            max-width: 750px;
            margin: 0 auto 70px auto;
            line-height: 1.7;
            font-weight: 400;
        }

        /* Estilo da Mensagem de Manutenção */
        .maintenance-message {
            font-size: 2.2rem;
            font-weight: 700;
            margin-top: 50px;
            color: var(--glow-cyan); /* Usa a cor do botão 'Descubra a Simbiose' */
            text-shadow: 0 0 15px var(--glow-cyan);
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .logo-center {
                font-size: 2.2rem;
                margin-bottom: 30px;
            }
            .hero-title {
                font-size: 2.8rem;
            }
            .hero-description {
                font-size: 1rem;
                margin-bottom: 50px;
            }
            .maintenance-message {
                font-size: 1.6rem;
            }
        }

    </style>
</head>
<body>

    <div class="maintenance-background" style="background-image: url('https://picsum.photos/1920/1080?random=1&nature,sustainability,carbon,credit,mitigation');">
    </div>

    <div class="content-wrapper">
        <div class="logo-center">ECOM<span>NIX</span></div>

        <h1 class="hero-title">A Natureza Entra na Rede.</h1>
        <p class="hero-description">ECOMNIX é o ecossistema de inteligência regenerativa que traduz o valor da Terra em ativos digitais, conectando a economia climática ao futuro da preservação.</p>
        
        <p class="maintenance-message">SITE EM MANUTENÇÃO, AGUARDE... NOVIDADES EM BREVE</p>
    </div>

</body>
</html>
